version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: task_tracker_db
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5400:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: